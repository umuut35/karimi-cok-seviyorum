<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Karımı çok seviyom</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: Arial, sans-serif;
      background: #ffe6f0;
      overflow: hidden;
      padding-top: 50px;
      position: relative;
    }

    .container {
      text-align: center;
      position: relative;
    }

    h1 {
      margin-bottom: 20px;
    }

    #gifSad {
      max-width: 300px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    button {
      font-size: 18px;
      padding: 12px 25px;
      margin: 10px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }

    #yes {
      background-color: #ff4d6d;
      color: white;
      width: 150px;
      height: 50px;
    }

    #no {
      background-color: #cccccc;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Şemso için beni affet </h1>

    <img id="gifSad" src="sad.gif" alt="Üzgün GIF">

    <div>
      <button id="yes">Evet</button>
      <button id="no">Hayır</button>
    </div>
  </div>

  <script>
    const yesBtn = document.getElementById("yes");
    const noBtn = document.getElementById("no");

    let clickCount = 0;
    const maxClicks = 5;

    const baseWidth = 150;
    const baseHeight = 50;
    const baseFontSize = 18;

    noBtn.addEventListener("click", () => {
      clickCount++;

      // Evet butonunu biraz büyüt
      const factor = 1 + 0.1 * clickCount;
      yesBtn.style.width = baseWidth * factor + "px";
      yesBtn.style.height = baseHeight * factor + "px";
      yesBtn.style.fontSize = baseFontSize * factor + "px";

      // Hayır butonunu rastgele konuma taşı
      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 50) + 50; // üst padding için 50px
      noBtn.style.position = "absolute";
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    });

    yesBtn.addEventListener("click", () => {
      alert("Yaa yaşasın! 💖"); // Evet’e basınca bir şey yapmak için
    });
  </script>

</body>
</html>
