<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Beni seviyon mu </title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #ffe6f0;
      overflow: hidden;
      position: relative;
    }

    .container {
      text-align: center;
      position: relative;
      width: 100%;
      height: 100%;
    }

    h1 {
      margin-bottom: 30px;
    }

    button {
      font-size: 18px;
      padding: 15px 30px;
      margin: 10px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    #yes {
      background-color: #ff4d6d;
      color: white;
      z-index: 1;
    }

    #no {
      background-color: #cccccc;
      z-index: 0;
    }

    #gif {
      display: none;
      margin-top: 30px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 80vw;
      border-radius: 12px;
      z-index: 999;
    }

    .shark {
      position: absolute;
      font-size: 2rem;
      pointer-events: none;
      animation: swim 5s linear infinite;
      z-index: 1000;
    }

    @keyframes swim {
      0% { transform: translateX(-10vw) translateY(0); }
      50% { transform: translateX(110vw) translateY(20vh); }
      100% { transform: translateX(-10vw) translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Forgive me karıcığım</h1>

    <button id="yes">Evet</button>
    <button id="no">Hayır</button>

    <img id="gif" src="askim.gif" alt="Mutluluk">
  </div>

  <script>
    const yesBtn = document.getElementById("yes");
    const noBtn = document.getElementById("no");
    const gif = document.getElementById("gif");

    let clickCount = 0;
    const maxClicks = 5;

    noBtn.addEventListener("click", () => {
      clickCount++;
      const scale = 1 + 0.3 * clickCount;

      yesBtn.style.transform = `scale(${scale})`;

      if (clickCount >= maxClicks) {
        yesBtn.style.position = "absolute";
        yesBtn.style.top = 0;
        yesBtn.style.left = 0;
        yesBtn.style.width = "100vw";
        yesBtn.style.height = "100vh";
        yesBtn.style.fontSize = "3rem";
        yesBtn.style.borderRadius = "0";
        yesBtn.style.zIndex = 999;

        noBtn.style.display = "none";
      }
    });

    yesBtn.addEventListener("click", () => {
      gif.style.display = "block";
      gif.style.maxWidth = "90vw"; // biraz daha büyük
      yesBtn.style.display = "none";
      noBtn.style.display = "none";

      // Köpek balığı emoji oluştur ve animasyon başlat
      for(let i = 0; i < 5; i++) { // 5 tane köpek balığı
        const shark = document.createElement("div");
        shark.className = "shark";
        shark.innerText = "🦈";
        shark.style.top = Math.random() * window.innerHeight * 0.8 + "px";
        document.body.appendChild(shark);

        // Rastgele animasyon süresi
        shark.style.animationDuration = 4 + Math.random() * 3 + "s";
      }
    });
  </script>

</body>
</html>
