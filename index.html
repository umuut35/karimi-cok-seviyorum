<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Beni Seviyon mu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #ffe6f0;
      overflow: hidden;
    }

    .container {
      text-align: center;
      position: relative;
      width: 100%;
      height: 100%;
    }

    h1 {
      margin-bottom: 30px;
    }

    button {
      font-size: 18px;
      padding: 15px 30px;
      margin: 10px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    #yes {
      background-color: #ff4d6d;
      color: white;
      z-index: 1;
    }

    #no {
      background-color: #cccccc;
      z-index: 0;
    }

    #gif {
      display: none;
      margin-top: 30px;
    }

    #gif img {
      width: 280px;
      max-width: 90vw;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Forgive me karıcığım </h1>

    <button id="yes">Evet</button>
    <button id="no">Hayır</button>

    <div id="gif">
      <img src="askim.gif" alt="Mutluluk">
      <h2>Seni çok seviyorum karımm </h2>
    </div>
  </div>

  <script>
    const yesBtn = document.getElementById("yes");
    const noBtn = document.getElementById("no");
    const gif = document.getElementById("gif");

    let clickCount = 0;
    const maxClicks = 5;

    noBtn.addEventListener("click", () => {
      clickCount++;
      const scale = 1 + 0.3 * clickCount;

      yesBtn.style.transform = `scale(${scale})`;

      if (clickCount >= maxClicks) {
        // 5. tıklamada evet butonu tüm ekran
        yesBtn.style.position = "absolute";
        yesBtn.style.top = 0;
        yesBtn.style.left = 0;
        yesBtn.style.width = "100vw";
        yesBtn.style.height = "100vh";
        yesBtn.style.fontSize = "3rem";
        yesBtn.style.borderRadius = "0";
        yesBtn.style.zIndex = 999;

        noBtn.style.display = "none"; // Hayır butonunu gizle
      }
    });

    yesBtn.addEventListener("click", () => {
      gif.style.display = "block";
      yesBtn.style.display = "none";
      noBtn.style.display = "none";
    });
  </script>

</body>
</html>
