<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Bir Sorum Var 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #ffe6f0;
      overflow: hidden;
    }

    .container {
      text-align: center;
      position: relative;
      width: 100%;
      height: 100%;
    }

    h1 {
      margin-bottom: 30px;
    }

    button {
      font-size: 18px;
      padding: 15px 30px;
      margin: 10px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    #yes {
      background-color: #ff4d6d;
      color: white;
    }

    #no {
      background-color: #cccccc;
      position: absolute;
    }

    #gif {
      display: none;
      margin-top: 30px;
    }

    #gif img {
      width: 280px;
      max-width: 90vw;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Benimle çıkar mısın? 💕</h1>

    <button id="yes">Evet</button>
    <button id="no">Hayır</button>

    <div id="gif">
      <img src="askim.gif" alt="Mutluluk">
      <h2>Yaa yaşasın 😍💖</h2>
    </div>
  </div>

  <script>
    const yesBtn = document.getElementById("yes");
    const noBtn = document.getElementById("no");
    const gif = document.getElementById("gif");

    let scale = 1;

    // Hayır butonu kaçıyor
    noBtn.addEventListener("mouseenter", () => {
      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
    });

    // Hayır tıklayınca Evet büyüsün ve Hayır küçülsün
    noBtn.addEventListener("click", () => {
      scale += 0.3;
      yesBtn.style.transform = `scale(${scale})`;

      const noScale = Math.max(0.4, 1 - scale / 4);
      noBtn.style.transform = `scale(${noScale})`;
    });

    // Evet’e basınca GIF göster, butonları gizle
    yesBtn.addEventListener("click", () => {
      gif.style.display = "block";
      yesBtn.style.display = "none";
      noBtn.style.display = "none";
    });
  </script>

</body>
</html>
