<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Karımı çok seviyom</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #ffe6f0;
      overflow: hidden;
      position: relative;
    }

    h1 {
      margin-top: 30px;
      margin-bottom: 20px;
      text-align: center;
    }

    #gifSad {
      max-width: 300px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    button {
      font-size: 18px;
      padding: 12px 25px;
      margin: 10px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }

    #yes {
      background-color: #ff4d6d;
      color: white;
      width: 150px;
      height: 50px;
    }

    #no {
      background-color: #cccccc;
    }

    /* Evet’e basınca gösterilecek gif ve yazı */
    #gifLove {
      display: none;
      position: fixed; /* fixed ile ekran ortasında */
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 80vw;
      border-radius: 12px;
      z-index: 999;
    }

    #gifText {
      display: none;
      position: fixed;
      top: calc(50% + 45%); /* gif’in altına biraz boşluk bırak */
      left: 50%;
      transform: translateX(-50%);
      font-size: 2rem;
      color: #ff4d6d;
      z-index: 999;
      text-align: center;
      white-space: nowrap;
    }

  </style>
</head>
<body>

  <h1>Şemso için beni affet 💕</h1>

  <!-- Başlangıçta gösterilen sad.gif -->
  <img id="gifSad" src="sad.gif" alt="Üzgün GIF">

  <div>
    <button id="yes">Evet</button>
    <button id="no">Hayır</button>
  </div>

  <!-- Evet’e basınca gösterilecek askim.gif ve yazı -->
  <img id="gifLove" src="askim.gif" alt="Mutluluk GIF">
  <div id="gifText">Seni çok seviyorum karımm</div>

  <script>
    const yesBtn = document.getElementById("yes");
    const noBtn = document.getElementById("no");
    const gifSad = document.getElementById("gifSad");
    const gifLove = document.getElementById("gifLove");
    const gifText = document.getElementById("gifText");

    let clickCount = 0;

    const baseWidth = 150;
    const baseHeight = 50;
    const baseFontSize = 18;

    // Hayır butonu tıklama
    noBtn.addEventListener("click", () => {
      clickCount++;

      // Evet butonunu biraz büyüt
      const factor = 1 + 0.1 * clickCount;
      yesBtn.style.width = baseWidth * factor + "px";
      yesBtn.style.height = baseHeight * factor + "px";
      yesBtn.style.fontSize = baseFontSize * factor + "px";

      // Hayır butonunu rastgele konuma taşı
      const maxX = window.innerWidth - noBtn.offsetWidth;
      const maxY = window.innerHeight - noBtn.offsetHeight;
      const x = Math.random() * maxX;
      const y = Math.random() * maxY;
      noBtn.style.position = "fixed";
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    });

    // Evet butonu tıklama
    yesBtn.addEventListener("click", () => {
      // Başlangıç GIF’i gizle
      gifSad.style.display = "none";

      // askim.gif ve yazıyı göster
      gifLove.style.display = "block";
      gifText.style.display = "block";

      // Butonları gizle
      yesBtn.style.display = "none";
      noBtn.style.display = "none";
    });

  </script>

</body>
</html>
